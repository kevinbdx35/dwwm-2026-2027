<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La carte réagit en douceur</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Musées de Bretagne</h1>

      <article class="carte">
        <h2>musée de la pêche</h2>
        <p>Concarneau (Finistère)</p>
        <a class="carte-lien" href="#fiche">Voir la fiche</a>
      </article>

      <article class="carte">
        <h2>musée des beaux-arts</h2>
        <p>Quimper (Finistère)</p>
        <a class="carte-lien" href="#fiche">Voir la fiche</a>
      </article>

      <article class="carte">
        <h2>musée de Bretagne</h2>
        <p>Rennes (Ille-et-Vilaine)</p>
        <a class="carte-lien" href="#fiche">Voir la fiche</a>
      </article>

      <section id="fiche">
        <h2>La fiche</h2>
        <p>Dans le projet, la fiche du musée choisi s’affiche ici.</p>
      </section>
    </main>
  </body>
</html>
