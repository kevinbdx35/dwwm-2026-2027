<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La photo du musée</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Les deux images du dossier img/ sont des dessins faits pour ce cours (aucune photo externe) :
         musee.jpg, 800 x 500 pixels, en largeur ; phare.jpg, 500 x 800 pixels, en hauteur. -->
    <main>
      <h1>Musées de Bretagne</h1>

      <article class="carte">
        <img class="photo" src="img/musee.jpg" alt="Dessin : un bâtiment à colonnes, au bord de la mer.">
        <div class="carte-texte">
          <h2>musée de la pêche</h2>
          <p>Concarneau (Finistère)</p>
          <a class="carte-lien" href="#fiche">Voir la fiche</a>
        </div>
      </article>

      <article class="carte">
        <img class="photo" src="img/phare.jpg" alt="Dessin : un phare rayé rouge et blanc, sur un rocher.">
        <div class="carte-texte">
          <h2>musée des phares et balises</h2>
          <p>Ouessant (Finistère)</p>
          <a class="carte-lien" href="#fiche">Voir la fiche</a>
        </div>
      </article>

      <section id="fiche">
        <h2>La fiche</h2>
        <p>Dans le projet, la fiche du musée choisi s’affiche ici.</p>
      </section>
    </main>
  </body>
</html>
