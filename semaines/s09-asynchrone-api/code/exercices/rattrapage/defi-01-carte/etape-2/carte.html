<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le musée du jour - la carte</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Le musée du jour</h1>

      <!-- La carte : un article, un musée -->
      <article class="carte">
        <!-- Le haut de la carte : l'image et le badge -->
        <div class="carte-image">
          <!-- alt : ce que montre l'image, si on ne la voit pas -->
          <img src="images/musee-carte-postale.webp" alt="La maison en granit du musée, au toit d'ardoise">
          <!-- Le badge, posé sur l'image à l'étape 6 -->
          <p class="badge">Gratuit le dimanche</p>
        </div>
        <!-- Le bas de la carte : le texte -->
        <div class="carte-texte">
          <!-- Le nom du musée -->
          <h2 class="carte-titre">Musée de la carte postale</h2>
          <!-- La ville -->
          <p class="carte-ville">Port-Morvan</p>
          <!-- Une phrase pour donner envie -->
          <p>Plus de 20 000 cartes postales racontent les ports bretons d'hier.</p>
          <!-- Le lien vers la fiche (palier 2) -->
          <a class="carte-lien" href="#musee">Voir la fiche</a>
        </div>
      </article>

    </main>
  </body>
</html>
