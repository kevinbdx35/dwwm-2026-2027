<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chercher une ville</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <main>
      <h1>Chercher les musées d'une ville</h1>
      <form id="recherche" novalidate>
        <label for="ville">Ville</label>
        <input id="ville" name="ville" type="text" aria-describedby="erreur">
        <button type="submit">Chercher</button>
        <p id="erreur" class="erreur"></p>
      </form>
      <p id="resultat"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
