<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palier 3 — Un tableau HTML</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <main>
      <h1>Musées des Côtes-d'Armor</h1>
      <table>
        <caption>Les musées de France des Côtes-d'Armor</caption>

          <tr>
            <th scope="col">Musée</th>
            <th scope="col">Ville</th>
            <th scope="col">Domaines</th>
          </tr>
        </thead>
        <tbody id="lignes"></tbody>
      </table>
    </main>
    <script src="app.js"></script>
  </body>
</html>
