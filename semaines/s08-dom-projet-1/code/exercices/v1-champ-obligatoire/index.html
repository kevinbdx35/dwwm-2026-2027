<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palier 1 — Le champ obligatoire</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <main>
      <h1>Chercher un musée</h1>
      <form id="recherche" novalidate>
        <label for="requete">Nom ou ville</label>
        <input id="requete" name="requete" type="text" aria-describedby="erreur">
        <button type="submit">Chercher</button>
        <p id="erreur" class="erreur"></p>
      </form>
      <p id="resultat"></p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
