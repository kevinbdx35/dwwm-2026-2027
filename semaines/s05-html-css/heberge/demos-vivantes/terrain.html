<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain d'essai Flexbox et Grid</title>
<!-- Playground of the course (week 5, Thursday, Défi): original, no tracker, no external request. -->
<style>
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../../../../fonts/AtkinsonHyperlegibleNext-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Atkinson Hyperlegible Mono"; src: url("../../../../fonts/AtkinsonHyperlegibleMono-Variable.woff2") format("woff2"); font-weight: 200 800; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; font-size: 18px; line-height: 1.5; color: #1f2a5a; background: #fff; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { margin: 0 0 12px; max-width: 65ch; }
  .reglages { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 12px 24px; margin-bottom: 16px; }
  fieldset { border: 2px solid #c9d3e6; border-radius: 8px; padding: 8px 12px; margin: 0; }
  legend { font-weight: 700; padding: 0 4px; }
  label { display: block; margin: 4px 0; }
  select, input { font: inherit; }
  input[type="range"] { width: 100%; }
  :focus-visible { outline: 3px solid #b3122e; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .scene { min-height: 220px; padding: 8px; background: #e6ecf7; border: 3px dashed #1f2a5a; }
  .scene div { background: #1f2a5a; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 1.25rem; text-align: center; min-width: 3rem; }
  .scene div:nth-child(2n) { padding-block: 24px; }
  pre { margin: 16px 0 0; padding: 12px 16px; background: #f0f2f7; border-radius: 8px; font: 1.1rem/1.5 "Atkinson Hyperlegible Mono", monospace; white-space: pre-wrap; }
  @media (prefers-reduced-motion: no-preference) {
    .scene div { transition: all 0.25s ease; }
  }
</style>
</head>
<body>
<h1>Terrain d'essai Flexbox et Grid</h1>
<p>Changez un réglage : la mise en page change aussitôt, et le code CSS correspondant s'affiche en dessous. Tout se règle au clavier (Tab, puis les flèches).</p>

<div class="reglages">
  <fieldset>
    <legend>Mise en page</legend>
    <label><input type="radio" name="mode" value="flex" checked> Flexbox</label>
    <label><input type="radio" name="mode" value="grid"> Grid</label>
    <label>Nombre d'éléments : <output id="nombre-valeur">5</output>
      <input id="nombre" type="range" min="1" max="8" value="5"></label>
    <label>gap : <output id="gap-valeur">8px</output>
      <input id="gap" type="range" min="0" max="48" step="4" value="8"></label>
  </fieldset>
  <fieldset id="reglages-flex">
    <legend>Flexbox</legend>
    <label>flex-direction <select id="flex-direction"><option>row</option><option>row-reverse</option><option>column</option><option>column-reverse</option></select></label>
    <label>justify-content <select id="justify-content"><option>flex-start</option><option>center</option><option>flex-end</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select></label>
    <label>align-items <select id="align-items"><option>stretch</option><option>flex-start</option><option>center</option><option>flex-end</option><option>baseline</option></select></label>
    <label><input id="flex-wrap" type="checkbox"> flex-wrap: wrap</label>
  </fieldset>
  <fieldset id="reglages-grid" hidden>
    <legend>Grid</legend>
    <label>Nombre de colonnes (repeat) : <output id="colonnes-valeur">3</output>
      <input id="colonnes" type="range" min="1" max="4" value="3"></label>
    <label>Largeur des colonnes <select id="largeur"><option value="1fr">1fr (parts égales)</option><option value="10rem">10rem (fixe)</option></select></label>
  </fieldset>
</div>

<div class="scene" id="scene" aria-label="Le conteneur et ses éléments"></div>
<pre id="code" aria-live="polite"></pre>

<script>
  const $ = (id) => document.getElementById(id);
  const scene = $('scene');
  function update() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const n = Number($('nombre').value);
    const gap = `${$('gap').value}px`;
    $('nombre-valeur').textContent = n;
    $('gap-valeur').textContent = gap;
    $('reglages-flex').hidden = mode !== 'flex';
    $('reglages-grid').hidden = mode !== 'grid';
    scene.replaceChildren(...Array.from({ length: n }, (_, i) => Object.assign(document.createElement('div'), { textContent: i + 1 })));
    scene.removeAttribute('style');
    let declarations;
    if (mode === 'flex') {
      declarations = {
        display: 'flex',
        'flex-direction': $('flex-direction').value,
        'justify-content': $('justify-content').value,
        'align-items': $('align-items').value,
        ...($('flex-wrap').checked ? { 'flex-wrap': 'wrap' } : {}),
        gap,
      };
    } else {
      const c = Number($('colonnes').value);
      $('colonnes-valeur').textContent = c;
      declarations = { display: 'grid', 'grid-template-columns': `repeat(${c}, ${$('largeur').value})`, gap };
    }
    for (const [property, value] of Object.entries(declarations)) scene.style.setProperty(property, value);
    $('code').textContent = `.conteneur {\n${Object.entries(declarations).map(([p, v]) => `  ${p}: ${v};`).join('\n')}\n}`;
  }
  document.querySelectorAll('input, select').forEach((el) => el.addEventListener('input', update));
  update();
</script>
</body>
</html>
