<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img" aria-labelledby="titre desc" font-family="system-ui, sans-serif">
  <title id="titre">Les zones d'une page sémantique</title>
  <desc id="desc">Une page dessinée en quatre zones, de haut en bas. En haut, l'en-tête, header, qui contient le menu, nav, avec trois liens. Au centre, le contenu principal, main : il commence par le titre h1, puis deux parties, chacune une section avec son titre h2. En bas, le pied de page, footer.</desc>
  <!-- Dessin original, réalisé pour le cours (licence du site). -->
  <rect x="0" y="0" width="520" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="500" height="420" rx="8" fill="#ffffff" stroke="#1f2a5a" stroke-width="3"/>
  <!-- header + nav -->
  <rect x="25" y="25" width="470" height="70" rx="6" fill="#e8e2d2" stroke="#1f2a5a" stroke-width="2"/>
  <text x="40" y="50" font-size="19" font-weight="bold" fill="#1f2a5a">header</text>
  <rect x="210" y="40" width="270" height="42" rx="5" fill="#ffffff" stroke="#1f2a5a" stroke-width="2"/>
  <text x="222" y="67" font-size="18" font-weight="bold" fill="#1f2a5a">nav</text>
  <g font-size="16" fill="#1f2a5a"><text x="270" y="67">Accueil</text><text x="340" y="67">Projets</text><text x="410" y="67">Contact</text></g>
  <!-- main -->
  <rect x="25" y="110" width="470" height="240" rx="6" fill="#cfe0f5" stroke="#1f2a5a" stroke-width="2"/>
  <text x="40" y="136" font-size="19" font-weight="bold" fill="#1f2a5a">main</text>
  <rect x="40" y="148" width="440" height="40" rx="4" fill="#ffffff" stroke="#1f2a5a"/>
  <text x="52" y="175" font-size="18" fill="#1f2a5a"><tspan font-weight="bold">h1</tspan> Alex, développeur web en formation</text>
  <rect x="40" y="200" width="440" height="66" rx="4" fill="#ffffff" stroke="#1f2a5a"/>
  <text x="52" y="224" font-size="18" font-weight="bold" fill="#1f2a5a">section</text>
  <text x="52" y="251" font-size="18" fill="#1f2a5a"><tspan font-weight="bold">h2</tspan> Projets</text>
  <rect x="40" y="276" width="440" height="62" rx="4" fill="#ffffff" stroke="#1f2a5a"/>
  <text x="52" y="300" font-size="18" font-weight="bold" fill="#1f2a5a">section</text>
  <text x="52" y="326" font-size="18" fill="#1f2a5a"><tspan font-weight="bold">h2</tspan> Contact</text>
  <!-- footer -->
  <rect x="25" y="365" width="470" height="50" rx="6" fill="#e8e2d2" stroke="#1f2a5a" stroke-width="2"/>
  <text x="40" y="396" font-size="19" font-weight="bold" fill="#1f2a5a">footer</text>
</svg>
