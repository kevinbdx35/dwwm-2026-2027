  <text x="725" y="301" font-size="28" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" fill="#1c1e21" text-anchor="middle">165484</text>
  <text x="40" y="400" font-size="30" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="bold" fill="#1c1e21" text-anchor="start">museum.city</text>
  <path d="M150 365 L272 232" stroke="#17703a" stroke-width="4" fill="none" marker-end="url(#objet-p-ok)"/>
  <text x="40" y="445" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1c1e21" text-anchor="start">lit la valeur de la clé city :</text>
  <rect x="450" y="405" width="230" height="60" rx="8" fill="#edf7f0" stroke="#17703a" stroke-width="3"/>
  <text x="565" y="446" font-size="28" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="bold" fill="#17703a" text-anchor="middle">'COLMAR'</text>
  <text x="40" y="500" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#525860" text-anchor="start">Une clé absente (museum.country) donne undefined.</text>
</svg>
