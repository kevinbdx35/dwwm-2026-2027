  <title id="tri-t">toSorted garde le tableau d’origine, sort le modifie</title>
  <desc id="tri-d">En haut, toSorted : prices vaut 25, 8, 100, 10 ; un nouveau tableau trié sort, 8, 10, 25, 100 ; prices reste 25, 8, 100, 10, intact. En bas, sort : le même tableau prices est réordonné en 8, 10, 25, 100 ; l’original est modifié.</desc>
