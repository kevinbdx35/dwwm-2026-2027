<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" width="1000" height="525" role="img" aria-labelledby="find-t find-d">
  <title id="find-t">find s’arrête à la première case qui correspond</title>
  <desc id="find-d">prices contient 10, 25, 8 et 40. Le test est price &gt; 20. find regarde 10 : non. Il regarde 25 : oui, il s’arrête. 8 et 40 ne sont pas regardés. find renvoie un seul élément, 25. Si aucune case ne passe le test, find renvoie undefined.</desc>
  <defs><marker id="find-p-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#525860"/></marker><marker id="find-p-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f5fbf"/></marker><marker id="find-p-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17703a"/></marker><marker id="find-p-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="find-p-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a24c00"/></marker></defs>
  <rect x="0" y="0" width="1000" height="525" fill="#ffffff"/>
  <text x="40" y="50" font-size="30" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" fill="#1c1e21" text-anchor="start">prices.find((price) =&gt; price &gt; 20)</text>
  <rect x="60" y="90" width="170" height="80" rx="8" fill="#f6f7f9" stroke="#525860" stroke-width="3"/>
  <text x="145" y="141" font-size="32" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" fill="#1c1e21" text-anchor="middle">10</text>
  <rect x="40" y="230" width="210" height="70" rx="8" fill="#fdf0f0" stroke="#b91c1c" stroke-width="3"/>
  <text x="145" y="276" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-weight="bold" fill="#b91c1c" text-anchor="middle">non</text>
  <path d="M145 175 L145 225" stroke="#b91c1c" stroke-width="4" fill="none" marker-end="url(#find-p-ko)"/>
  <rect x="290" y="90" width="170" height="80" rx="8" fill="#f6f7f9" stroke="#525860" stroke-width="3"/>
  <text x="375" y="141" font-size="32" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" fill="#1c1e21" text-anchor="middle">25</text>
  <rect x="270" y="230" width="210" height="70" rx="8" fill="#edf7f0" stroke="#17703a" stroke-width="3"/>
  <text x="375" y="276" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-weight="bold" fill="#17703a" text-anchor="middle">oui : stop</text>
  <path d="M375 175 L375 225" stroke="#17703a" stroke-width="4" fill="none" marker-end="url(#find-p-ok)"/>
  <rect x="520" y="90" width="170" height="80" rx="8" fill="#ffffff" stroke="#525860" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="605" y="141" font-size="32" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" fill="#525860" text-anchor="middle">8</text>
  <rect x="500" y="230" width="210" height="70" rx="8" fill="#ffffff" stroke="#525860" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="605" y="276" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#525860" text-anchor="middle">pas regardé</text>
  <rect x="750" y="90" width="170" height="80" rx="8" fill="#ffffff" stroke="#525860" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="835" y="141" font-size="32" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" fill="#525860" text-anchor="middle">40</text>
  <rect x="730" y="230" width="210" height="70" rx="8" fill="#ffffff" stroke="#525860" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="835" y="276" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#525860" text-anchor="middle">pas regardé</text>
  <path d="M80 340 L360 340" stroke="#1f5fbf" stroke-width="4" fill="none" marker-end="url(#find-p-accent)"/>
  <text x="60" y="385" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1f5fbf" text-anchor="start">il regarde dans l’ordre, puis s’arrête</text>
  <text x="40" y="445" font-size="30" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1c1e21" text-anchor="start">renvoie un élément :</text>
  <rect x="330" y="400" width="170" height="70" rx="8" fill="#edf7f0" stroke="#17703a" stroke-width="3"/>
  <text x="415" y="446" font-size="32" font-family="Atkinson Hyperlegible Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="bold" fill="#1c1e21" text-anchor="middle">25</text>
  <text x="40" y="500" font-size="28" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" fill="#1c1e21" text-anchor="start">Aucune case ne passe le test ? find renvoie undefined.</text>
</svg>
