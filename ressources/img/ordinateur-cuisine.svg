<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="titre desc" font-family="system-ui, sans-serif">
  <title id="titre">L'ordinateur comme une cuisine</title>
  <desc id="desc">Le disque est le placard : il garde les recettes et les ingrédients, même éteint. Lancer un programme, c'est sortir la recette du placard et la poser sur le plan de travail : la mémoire vive, rapide, vidée quand on éteint. Le processeur est le cuisinier : il lit la recette, le programme, et suit ses instructions une par une, dans l'ordre.</desc>
  <!-- Dessin original, réalisé pour le cours (licence du site). -->
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <!-- Placard : le disque -->
  <rect x="20" y="40" width="180" height="230" rx="8" fill="#e8e2d2" stroke="#1f2a5a" stroke-width="3"/>
  <line x1="110" y1="40" x2="110" y2="270" stroke="#1f2a5a" stroke-width="2"/>
  <circle cx="98" cy="155" r="5" fill="#1f2a5a"/><circle cx="122" cy="155" r="5" fill="#1f2a5a"/>
  <rect x="35" y="70" width="60" height="40" rx="3" fill="#ffffff" stroke="#1f2a5a"/>
  <text x="65" y="95" font-size="13" text-anchor="middle" fill="#1f2a5a">recettes</text>
  <text x="110" y="300" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2a5a">Le placard</text>
  <text x="110" y="320" font-size="14" text-anchor="middle" fill="#333">= le disque (garde tout)</text>
  <!-- Flèche : lancer un programme -->
  <line x1="210" y1="150" x2="290" y2="150" stroke="#b3122e" stroke-width="3"/>
  <polygon points="290,142 304,150 290,158" fill="#b3122e"/>
  <text x="257" y="135" font-size="13" text-anchor="middle" fill="#b3122e">lancer</text>
  <!-- Plan de travail : la mémoire vive -->
  <rect x="310" y="170" width="260" height="30" rx="4" fill="#c9b99a" stroke="#1f2a5a" stroke-width="3"/>
  <rect x="330" y="200" width="20" height="70" fill="#1f2a5a"/><rect x="530" y="200" width="20" height="70" fill="#1f2a5a"/>
  <rect x="340" y="130" width="90" height="40" rx="3" fill="#ffffff" stroke="#1f2a5a"/>
  <text x="385" y="148" font-size="12" text-anchor="middle" fill="#1f2a5a">la recette</text>
  <text x="385" y="163" font-size="12" text-anchor="middle" fill="#1f2a5a">(le programme)</text>
  <circle cx="470" cy="155" r="14" fill="#f2c14e" stroke="#1f2a5a"/><circle cx="505" cy="158" r="11" fill="#b3122e" stroke="#1f2a5a"/>
  <text x="440" y="300" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2a5a">Le plan de travail</text>
  <text x="440" y="320" font-size="14" text-anchor="middle" fill="#333">= la mémoire vive (vidée à l'arrêt)</text>
  <!-- Cuisinier : le processeur -->
  <circle cx="670" cy="80" r="26" fill="#f4f1ea" stroke="#1f2a5a" stroke-width="3"/>
  <rect x="648" y="38" width="44" height="22" rx="8" fill="#ffffff" stroke="#1f2a5a" stroke-width="2"/>
  <rect x="640" y="108" width="60" height="90" rx="10" fill="#ffffff" stroke="#1f2a5a" stroke-width="3"/>
  <line x1="640" y1="130" x2="585" y2="160" stroke="#1f2a5a" stroke-width="3"/>
  <text x="670" y="230" font-size="13" text-anchor="middle" fill="#333">lit et suit la recette,</text>
  <text x="670" y="246" font-size="13" text-anchor="middle" fill="#333">une instruction à la fois</text>
  <text x="670" y="300" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2a5a">Le cuisinier</text>
  <text x="670" y="320" font-size="14" text-anchor="middle" fill="#333">= le processeur</text>
</svg>
