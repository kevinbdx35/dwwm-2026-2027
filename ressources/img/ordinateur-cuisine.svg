<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="titre desc" font-family="system-ui, sans-serif">
  <title id="titre">L'ordinateur comme une cuisine</title>
  <desc id="desc">Le disque est le placard : il garde les recettes et les ingrédients, même éteint. Lancer un programme, c'est sortir la recette du placard et la poser sur le plan de travail : la mémoire vive, rapide, vidée quand on éteint. Le processeur est le cuisinier : il lit la recette, le programme, et suit ses instructions une par une, dans l'ordre.</desc>
  <!-- Dessin original, réalisé pour le cours (licence du site). Texte de 18 px au moins (règle 15). -->
  <rect x="0" y="0" width="760" height="390" fill="#ffffff"/>
  <!-- Placard : le disque -->
  <rect x="20" y="40" width="200" height="230" rx="8" fill="#e8e2d2" stroke="#1f2a5a" stroke-width="3"/>
  <line x1="120" y1="40" x2="120" y2="270" stroke="#1f2a5a" stroke-width="2"/>
  <circle cx="108" cy="155" r="5" fill="#1f2a5a"/><circle cx="132" cy="155" r="5" fill="#1f2a5a"/>
  <rect x="28" y="62" width="86" height="40" rx="3" fill="#ffffff" stroke="#1f2a5a" stroke-width="2"/>
  <text x="71" y="88" font-size="18" text-anchor="middle" fill="#1f2a5a">recettes</text>
  <text x="120" y="320" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2a5a">Le placard</text>
  <text x="120" y="346" font-size="18" text-anchor="middle" fill="#333">= le disque</text>
  <text x="120" y="370" font-size="18" text-anchor="middle" fill="#333">(garde tout)</text>
  <!-- Flèche : lancer un programme -->
  <line x1="228" y1="150" x2="284" y2="150" stroke="#b3122e" stroke-width="3"/>
  <polygon points="284,142 298,150 284,158" fill="#b3122e"/>
  <text x="260" y="132" font-size="18" text-anchor="middle" fill="#b3122e">lancer</text>
  <!-- Plan de travail : la mémoire vive -->
  <rect x="305" y="180" width="275" height="30" rx="4" fill="#c9b99a" stroke="#1f2a5a" stroke-width="3"/>
  <rect x="325" y="210" width="20" height="60" fill="#1f2a5a"/><rect x="540" y="210" width="20" height="60" fill="#1f2a5a"/>
  <rect x="312" y="116" width="150" height="64" rx="3" fill="#ffffff" stroke="#1f2a5a" stroke-width="2"/>
  <text x="387" y="142" font-size="18" text-anchor="middle" fill="#1f2a5a">la recette</text>
  <text x="387" y="166" font-size="18" text-anchor="middle" fill="#1f2a5a">(le programme)</text>
  <circle cx="500" cy="165" r="14" fill="#f2c14e" stroke="#1f2a5a"/><circle cx="535" cy="168" r="11" fill="#b3122e" stroke="#1f2a5a"/>
  <text x="440" y="320" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2a5a">Le plan de travail</text>
  <text x="440" y="346" font-size="18" text-anchor="middle" fill="#333">= la mémoire vive</text>
  <text x="440" y="370" font-size="18" text-anchor="middle" fill="#333">(vidée à l'arrêt)</text>
  <!-- Cuisinier : le processeur -->
  <circle cx="680" cy="70" r="26" fill="#f4f1ea" stroke="#1f2a5a" stroke-width="3"/>
  <rect x="658" y="28" width="44" height="22" rx="8" fill="#ffffff" stroke="#1f2a5a" stroke-width="2"/>
  <rect x="650" y="98" width="60" height="90" rx="10" fill="#ffffff" stroke="#1f2a5a" stroke-width="3"/>
  <line x1="650" y1="120" x2="590" y2="165" stroke="#1f2a5a" stroke-width="3"/>
  <text x="680" y="218" font-size="18" text-anchor="middle" fill="#333">suit la recette,</text>
  <text x="680" y="242" font-size="18" text-anchor="middle" fill="#333">une instruction</text>
  <text x="680" y="266" font-size="18" text-anchor="middle" fill="#333">à la fois</text>
  <text x="680" y="320" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2a5a">Le cuisinier</text>
  <text x="680" y="346" font-size="18" text-anchor="middle" fill="#333">= le processeur</text>
</svg>
