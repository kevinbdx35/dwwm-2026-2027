<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Schéma simplifié d'une carte mère</title>
  <desc id="d">Une carte mère vue de dessus. À gauche, les ports (USB, HDMI). Au centre gauche, le processeur. À sa droite, quatre barrettes de mémoire vive, puis le chipset et le connecteur d'alimentation. En bas, l'emplacement du stockage SSD M.2 NVMe, le port PCIe de la carte graphique, la puce UEFI et sa pile.</desc>
  <!-- Dessin original pour le cours, d'après le support « C'est quoi un ordinateur ? » de Kevin Bardoux. -->
  <rect x="10" y="10" width="740" height="360" rx="14" fill="#1e5c3a" stroke="#0f3320" stroke-width="3"/>
  <g fill="#c9ced6" stroke="#7a828c"><rect x="30" y="45" width="40" height="26" rx="4"/><rect x="30" y="80" width="40" height="26" rx="4"/><rect x="30" y="115" width="40" height="26" rx="4"/><rect x="30" y="150" width="40" height="26" rx="4"/></g>
  <text x="50" y="200" font-size="13" fill="#ffffff" text-anchor="middle">Ports</text>
  <text x="50" y="216" font-size="13" fill="#ffffff" text-anchor="middle">USB, HDMI…</text>
  <rect x="140" y="70" width="140" height="140" rx="8" fill="#d6dae0" stroke="#59606b" stroke-width="3"/>
  <rect x="170" y="100" width="80" height="80" rx="4" fill="#8f97a3"/>
  <text x="210" y="147" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU</text>
  <text x="210" y="232" font-size="14" fill="#ffffff" text-anchor="middle">Processeur</text>
  <g fill="#2b5fd9" stroke="#1a3d8f"><rect x="340" y="50" width="18" height="170" rx="3"/><rect x="368" y="50" width="18" height="170" rx="3"/></g>
  <g fill="#3b4250" stroke="#1d222b"><rect x="396" y="50" width="18" height="170" rx="3"/><rect x="424" y="50" width="18" height="170" rx="3"/></g>
  <text x="391" y="40" font-size="14" fill="#ffffff" text-anchor="middle">Mémoire vive (RAM)</text>
  <rect x="500" y="110" width="70" height="60" rx="6" fill="#4a5361" stroke="#22272f"/>
  <text x="535" y="145" font-size="13" fill="#ffffff" text-anchor="middle">Chipset</text>
  <rect x="640" y="30" width="80" height="110" rx="6" fill="#f2f2f2" stroke="#9aa0a8"/>
  <text x="680" y="90" font-size="13" fill="#1d222b" text-anchor="middle">Alim.</text>
  <rect x="140" y="270" width="190" height="32" rx="4" fill="#15181e" stroke="#555"/>
  <g fill="#4a5361"><rect x="160" y="277" width="34" height="18"/><rect x="204" y="277" width="34" height="18"/><rect x="248" y="277" width="34" height="18"/></g>
  <text x="235" y="325" font-size="14" fill="#ffffff" text-anchor="middle">Stockage SSD (M.2 NVMe)</text>
  <rect x="390" y="245" width="250" height="18" rx="3" fill="#15181e"/>
  <text x="515" y="285" font-size="14" fill="#ffffff" text-anchor="middle">Port PCIe (carte graphique)</text>
  <rect x="600" y="300" width="30" height="22" rx="3" fill="#15181e"/>
  <circle cx="670" cy="311" r="17" fill="#d9d9d9" stroke="#8a8a8a"/>
  <text x="645" y="350" font-size="13" fill="#ffffff" text-anchor="middle">Puce UEFI + pile</text>
</svg>
