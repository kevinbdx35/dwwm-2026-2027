<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Schéma simplifié d'une carte mère</title>
  <desc id="d">Une carte mère vue de dessus. À gauche, les ports (USB, HDMI). Au centre gauche, le processeur. À sa droite, quatre barrettes de mémoire vive, puis le chipset et le connecteur d'alimentation. En bas, l'emplacement du stockage SSD M.2 NVMe, le port PCIe de la carte graphique, la puce UEFI et sa pile.</desc>
  <!-- Dessin original pour le cours, d'après le support « C'est quoi un ordinateur ? » de Kevin Bardoux. Texte de 18 px au moins (règle 15). -->
  <rect x="10" y="10" width="740" height="400" rx="14" fill="#1e5c3a" stroke="#0f3320" stroke-width="3"/>
  <g fill="#c9ced6" stroke="#7a828c"><rect x="35" y="45" width="40" height="26" rx="4"/><rect x="35" y="80" width="40" height="26" rx="4"/><rect x="35" y="115" width="40" height="26" rx="4"/><rect x="35" y="150" width="40" height="26" rx="4"/></g>
  <text x="55" y="206" font-size="18" fill="#ffffff" text-anchor="middle">Ports</text>
  <text x="55" y="228" font-size="18" fill="#ffffff" text-anchor="middle">USB,</text>
  <text x="55" y="250" font-size="18" fill="#ffffff" text-anchor="middle">HDMI…</text>
  <rect x="120" y="70" width="140" height="140" rx="8" fill="#d6dae0" stroke="#59606b" stroke-width="3"/>
  <rect x="150" y="100" width="80" height="80" rx="4" fill="#8f97a3"/>
  <text x="190" y="148" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU</text>
  <text x="190" y="238" font-size="18" fill="#ffffff" text-anchor="middle">Processeur</text>
  <g fill="#2b5fd9" stroke="#1a3d8f"><rect x="310" y="60" width="18" height="160" rx="3"/><rect x="338" y="60" width="18" height="160" rx="3"/></g>
  <g fill="#3b4250" stroke="#1d222b"><rect x="366" y="60" width="18" height="160" rx="3"/><rect x="394" y="60" width="18" height="160" rx="3"/></g>
  <text x="361" y="46" font-size="18" fill="#ffffff" text-anchor="middle">Mémoire vive (RAM)</text>
  <rect x="470" y="110" width="100" height="60" rx="6" fill="#4a5361" stroke="#22272f"/>
  <text x="520" y="146" font-size="18" fill="#ffffff" text-anchor="middle">Chipset</text>
  <rect x="630" y="30" width="95" height="110" rx="6" fill="#f2f2f2" stroke="#9aa0a8"/>
  <text x="677" y="91" font-size="18" fill="#1d222b" text-anchor="middle">Alim.</text>
  <rect x="110" y="290" width="200" height="32" rx="4" fill="#15181e" stroke="#555"/>
  <g fill="#4a5361"><rect x="130" y="297" width="40" height="18"/><rect x="185" y="297" width="40" height="18"/><rect x="240" y="297" width="40" height="18"/></g>
  <text x="210" y="352" font-size="18" fill="#ffffff" text-anchor="middle">Stockage SSD</text>
  <text x="210" y="374" font-size="18" fill="#ffffff" text-anchor="middle">(M.2 NVMe)</text>
  <rect x="380" y="260" width="250" height="18" rx="3" fill="#15181e"/>
  <text x="505" y="304" font-size="18" fill="#ffffff" text-anchor="middle">Port PCIe</text>
  <text x="505" y="326" font-size="18" fill="#ffffff" text-anchor="middle">(carte graphique)</text>
  <rect x="595" y="340" width="30" height="22" rx="3" fill="#15181e"/>
  <circle cx="665" cy="351" r="17" fill="#d9d9d9" stroke="#8a8a8a"/>
  <text x="640" y="396" font-size="18" fill="#ffffff" text-anchor="middle">Puce UEFI + pile</text>
</svg>
